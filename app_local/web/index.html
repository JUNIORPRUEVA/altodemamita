<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de Solares - gestion de ventas de solares, clientes, cuotas y pagos.">

  <!-- Identidad visual de la aplicacion -->
  <meta name="theme-color" content="#16324F">
  <meta name="color-scheme" content="light">

  <!-- PWA en Android / navegadores compatibles -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Sistema de Solares">

  <!-- PWA en iPhone / iPad (Safari "Agregar a pantalla de inicio") -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solares">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Icono del navegador -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sistema de Solares</title>
  <link rel="manifest" href="manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('flutter_service_worker.js').catch(function () {
        // Sin service worker la aplicacion sigue funcionando en linea.
      });
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F4F1EA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Pantalla de carga mientras Flutter inicializa.
       No muestra informacion tecnica al cliente. */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background-color: #F4F1EA;
      color: #16324F;
      z-index: 1;
      padding: 24px;
      text-align: center;
    }

    #app-loading .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(22, 50, 79, 0.2);
      border-top-color: #16324F;
      border-radius: 50%;
      animation: app-spin 0.9s linear infinite;
    }

    #app-loading .label {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    @keyframes app-spin {
      to { transform: rotate(360deg); }
    }

    /* Aviso de nueva version disponible. */
    #app-update-banner {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background-color: #16324F;
      color: #FFFFFF;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      z-index: 2;
      font-size: 14px;
      font-weight: 600;
    }

    #app-update-banner.visible {
      display: flex;
    }

    #app-update-banner button {
      margin-left: auto;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      background-color: #FFFFFF;
      color: #16324F;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="spinner"></div>
    <div class="label">Preparando el sistema...</div>
  </div>

  <div id="app-update-banner" role="status">
    <span>Hay una nueva version disponible.</span>
    <button type="button" id="app-update-button">Actualizar</button>
  </div>

  <script src="runtime-config.js"></script>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    (function () {
      'use strict';

      // --- Actualizacion controlada -------------------------------------
      // No se fuerza ninguna recarga automatica: el usuario decide cuando
      // aplicar la nueva version. Asi nadie queda atrapado en una version
      // antigua ni se interrumpe una operacion en curso.
      var updateButton = document.getElementById('app-update-button');
      var updateBanner = document.getElementById('app-update-banner');

      function showUpdateBanner() {
        if (updateBanner) {
          updateBanner.classList.add('visible');
        }
      }

      if (updateButton) {
        updateButton.addEventListener('click', function () {
          window.location.reload();
        });
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(function (registration) {
          // Si ya habia un service worker controlando la pagina, cualquier
          // cambio de control significa que se publico una version nueva.
          var hadController = !!navigator.serviceWorker.controller;

          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!hadController) {
              // Primera instalacion: no hay nada que actualizar.
              hadController = true;
              return;
            }
            showUpdateBanner();
          });

          if (registration.waiting) {
            // Ya habia una version nueva esperando cuando se abrio la app.
            showUpdateBanner();
          }

          registration.addEventListener('updatefound', function () {
            var installing = registration.installing;
            if (!installing) {
              return;
            }
            installing.addEventListener('statechange', function () {
              if (installing.state === 'installed' &&
                  navigator.serviceWorker.controller) {
                showUpdateBanner();
              }
            });
          });
        }).catch(function () {
          // Sin service worker la aplicacion sigue funcionando en linea.
        });
      }

      // --- Oculta la pantalla de carga cuando Flutter esta listo --------
      window.addEventListener('flutter-first-frame', function () {
        var loading = document.getElementById('app-loading');
        if (loading && loading.parentNode) {
          loading.parentNode.removeChild(loading);
        }
      });
    })();
  </script>
</body>
</html>
