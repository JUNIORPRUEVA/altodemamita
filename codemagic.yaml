workflows:
  app-owner-ios:
    name: App Owner iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodemagicKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sistemasolares.sistema-solares-owner
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_DIR: app_owner
        OWNER_API_BASE_URL: https://altodemanita-backend.onqyr1.easypanel.host
        BUNDLE_ID: com.sistemasolares.sistema-solares-owner
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Prepare Flutter project
        script: |
          cd "$APP_DIR"
          flutter clean
          flutter pub get
      - name: Install iOS pods
        script: |
          cd "$APP_DIR/ios"
          pod install
      - name: Set up iOS code signing
        script: |
          cd "$APP_DIR"
          xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Analyze
        script: |
          cd "$APP_DIR"
          flutter analyze
      - name: Build signed iOS IPA
        script: |
          cd "$APP_DIR"
          flutter build ipa --release \
            -t lib/main.dart \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=OWNER_API_BASE_URL="$OWNER_API_BASE_URL"
    artifacts:
      - app_owner/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # Publishing is intentionally not enabled here to avoid automatic upload.
    # After App Store Connect is configured and you are ready to upload,
    # enable this block:
    #
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: false
